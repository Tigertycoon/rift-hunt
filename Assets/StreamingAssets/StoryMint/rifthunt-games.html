<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RiftHunt Spiele</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111319;
      --panel: #1c222b;
      --panel-2: #232b35;
      --text: #f4f7fb;
      --muted: #aab6c5;
      --line: #394452;
      --accent: #f26d3d;
      --accent-2: #51c7b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(160deg, rgba(81, 199, 184, 0.18), transparent 34%),
        linear-gradient(20deg, rgba(242, 109, 61, 0.2), transparent 42%),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 28px);
    }

    header {
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent-2);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 62px);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .lead {
      max-width: 680px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.45;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .game {
      min-height: 214px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24);
    }

    .mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #10151d;
      color: var(--accent-2);
      font-size: 28px;
      font-weight: 900;
      border: 1px solid var(--line);
    }

    .game h2 {
      margin: 18px 0 6px;
      font-size: 24px;
      letter-spacing: 0;
    }

    .game p {
      min-height: 44px;
      margin: 0;
      color: var(--muted);
      line-height: 1.35;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
    }

    .state {
      min-width: 82px;
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 800;
    }

    button,
    .back {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      font: inherit;
      font-weight: 800;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      text-decoration: none;
    }

    button {
      min-width: 112px;
    }

    button:active,
    .back:active {
      transform: translateY(1px);
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 20px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #2d3845;
    }

    @media (max-width: 520px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .game {
        min-height: 190px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">RiftHunt freigeschaltet</p>
      <h1>Spielauswahl</h1>
      <p class="lead">Waehle ein Spiel direkt aus. Nach einem Abschluss kommst du wieder hierher zurueck.</p>
    </header>

    <section class="grid" id="games" aria-label="RiftHunt Spiele"></section>

    <footer>
      <a class="back" href="../../">Zurueck zu RiftHunt</a>
    </footer>
  </main>

  <script>
    const freeTrailId = "storymint-rift-hunt-freeplay";
    const games = [
      {
        title: "GateRunner",
        label: "5 Level",
        url: "./bridge-test-game.html",
        gameId: "free-gaterunner"
      },
      {
        title: "FruitSlash",
        label: "Reflex-Spiel",
        url: "./bridge-test-game.html",
        gameId: "free-fruitslash"
      },
      {
        title: "SwipeGunner",
        label: "4 Level",
        url: "./bridge-test-game.html",
        gameId: "free-swipegunner"
      },
      {
        title: "FastFoodRush",
        label: "Finalspiel",
        url: "./bridge-test-game.html",
        gameId: "free-fastfoodrush"
      }
    ];

    function isComplete(gameId) {
      try {
        return localStorage.getItem("sm_game_" + gameId + "_complete") === "1";
      } catch (error) {
        return false;
      }
    }

    function buildGameUrl(game) {
      const url = new URL(game.url);
      url.searchParams.set("gameId", game.gameId);
      url.searchParams.set("trailId", freeTrailId);
      url.searchParams.set("stepId", game.gameId);
      url.searchParams.set("returnUrl", window.location.href);
      return url.toString();
    }

    function launch(game) {
      window.location.assign(buildGameUrl(game));
    }

    const container = document.getElementById("games");
    games.forEach((game) => {
      const card = document.createElement("article");
      card.className = "game";

      const top = document.createElement("div");

      const mark = document.createElement("div");
      mark.className = "mark";
      mark.textContent = game.title.charAt(0);

      const title = document.createElement("h2");
      title.textContent = game.title;

      const text = document.createElement("p");
      text.textContent = game.label;

      top.append(mark, title, text);

      const row = document.createElement("div");
      row.className = "row";

      const state = document.createElement("div");
      state.className = "state";
      state.textContent = isComplete(game.gameId) ? "GESPIELT" : "BEREIT";

      const button = document.createElement("button");
      button.type = "button";
      button.textContent = "Starten";
      button.addEventListener("click", () => launch(game));

      row.append(state, button);
      card.append(top, row);
      container.appendChild(card);
    });
  </script>
</body>
</html>
